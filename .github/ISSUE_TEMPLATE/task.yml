name: Phase task
description: Plan or track a focused GestureForge deliverable
title: "[Task]: "
labels:
  - task
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the user-visible or team-visible result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks that prove this task is done.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Shared contract
        - Chat and generation
        - Model rendering
        - Integration and demo
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link blocking issues or describe demo risks.
